<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Панел - Начало</title>
    <!-- Зареждаме нашия нов лек и красив CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="navbar">
            <a href="index.html" class="active">Начало</a>
            <a href="chart.html">Графика</a>
            <a href="light.html">Осветление</a>
        </div>

        <div class="main">
            <h1>Добре дошли в ESP32 Контролния Панел</h1>
            <p>Чист и лек интерфейс за управление без тежък софтуер.</p>

            <!-- Твоето точно име на логото, което откри -->
            <div style="text-align: center; margin: 30px 0;">
                <img src="img/logo.3f515cd1.png" alt="ESP32 Logo" style="max-width: 180px; height: auto;">
            </div>

            <div class="card">
                <h2>Системна Информация</h2>
                <table class="info-table">
                    <tr>
                        <td>Версия на фърмуера</td>
                        <td id="version">Зареждане...</td>
                    </tr>
                    <tr>
                        <td>Процесорни ядра (Cores)</td>
                        <td id="cores">Зареждане...</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchSystemInfo() {
            try {
                const response = await fetch('/api/v1/system/info');
                if (!response.ok) throw new Error(`Статус: ${response.status}`);

                const data = await response.json();

                document.getElementById('version').textContent = data.version || '—';
                document.getElementById('cores').textContent = data.cores || '—';

            } catch (error) {
                console.error("Грешка:", error);
                document.getElementById('version').textContent = "Грешка при връзка";
                document.getElementById('cores').textContent = "—";
            }
        }

        fetchSystemInfo();
    </script>
</body>
</html>
